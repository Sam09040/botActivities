type Query {
    address(userId: Int!): [Address],
    users(skip: Int, limit: Int): UsersPayload,
    user(id: Int!): User,
    hello: String
}

type Mutation {
    createUser(data: UserInput!): User!,
    createAddress(userId: Int!, data: AddressInput!): Address!,
    login(data: LoginInput!): AuthPayload!
}

type User {
    id: ID!
    name: String!
    email: String!
    birthDate: String!
    addresses: [Address]
}

type Address {
    id: ID!
    cep: String!
    street: String!
    streetNumber: String!
    complement: String
    neighborhood: String!
    city: String!
    state: String!
}

type AuthPayload {
    user: User!
    token: String!
}

type UsersPayload {
    users: [User]!,
    totalUsers: Int,
    page: Int,
    maxPage: Int
}

input UserInput {
    name: String!
    email: String!
    password: String!
    birthDate: String!
}

input LoginInput {
    email: String!
    password: String!
    rememberMe: Boolean!
}

input AddressInput {
    cep: String!
    street: String!
    streetNumber: String!
    complement: String
    neighborhood: String!
    city: String!
    state: String!
}
